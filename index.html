<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#1D6E8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#F2F3EF;--panel:rgba(250,250,247,.95);--ink:#1F2328;--muted:#646A72;--rule:#D4D7D0;--accent:#1D6E8C;--ok:#3F8F5B;--gps:#1E88E5;
 --area:#E3E5DE;--grid:#D0D3CB;--chip:#E6E8E2;--chip-on:#1D6E8C;--chip-on-ink:#fff;--hdr-h:96px}
@media (prefers-color-scheme: dark){:root{--bg:#15181C;--panel:rgba(28,32,37,.95);--ink:#E8E6E0;--muted:#9AA0A6;--rule:#2E333A;--accent:#5FB3D1;--ok:#5FBE86;--gps:#4FA3F0;
 --area:#2C333B;--grid:#3A4048;--chip:#2A2F36;--chip-on:#5FB3D1;--chip-on-ink:#0F1418}
 .leaflet-tile{filter:brightness(.92)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;overflow:hidden}
#map{position:absolute;inset:0;background:var(--bg)}
.hdr{position:absolute;top:0;left:0;right:0;z-index:800;pointer-events:none;padding-top:env(safe-area-inset-top,0)}
.hdr .bar{pointer-events:auto;margin:8px 8px 0;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:10px;padding:6px 10px 6px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hdr .row1{display:flex;align-items:baseline;gap:10px}
.hdr h1{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;font-weight:700;margin:0;white-space:nowrap;letter-spacing:.01em}
.hdr .sub{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 0 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:0 13px;height:36px;font:600 15px "Barlow Condensed",system-ui,sans-serif;cursor:pointer;min-width:40px}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.leaflet-top{top:calc(var(--hdr-h) + env(safe-area-inset-top,0))}
.leaflet-touch .leaflet-bar a{width:36px;height:36px;line-height:36px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:800;background:var(--panel);backdrop-filter:blur(8px);border-top:1px solid var(--rule);box-shadow:0 -2px 12px rgba(0,0,0,.15);padding:0 10px calc(8px + env(safe-area-inset-bottom,0));transition:transform .25s}
.sheet.min{transform:translateY(calc(100% - 66px - env(safe-area-inset-bottom,0)))}
.handle{height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.handle i{width:38px;height:4px;border-radius:2px;background:var(--rule);display:block}
.nav{height:22px;line-height:22px;font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.nav.off{color:var(--muted);font-weight:400}
.stat{display:flex;gap:12px;align-items:baseline;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font-variant-numeric:tabular-nums;margin:2px 0 2px;min-height:24px;white-space:nowrap}
.stat::-webkit-scrollbar{display:none}
.stat b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:19px;font-weight:600}
.stat span{color:var(--muted);font-size:13px}
.stat .ci{color:var(--ink)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px;align-items:center;white-space:nowrap}
.strip::-webkit-scrollbar{display:none}
.strip a,.strip button{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);border:0;border-radius:999px;padding:0 10px;height:30px;line-height:30px;font:600 13px "Barlow Condensed",system-ui,sans-serif;cursor:pointer}
.strip a.hi{background:var(--chip-on);color:var(--chip-on-ink)}
.strip .lbl{flex:0 0 auto;font-size:12px;color:var(--muted);margin-right:2px;width:46px}
#prof{display:block;width:100%;height:140px;}
@media (max-height:700px){#prof{height:110px}}
#prof{touch-action:none;border-radius:6px}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:4px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;align-items:center}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;vertical-align:middle;margin-right:3px}
.legend .attr{margin-left:auto;font-size:10px}
.legend .attr a{color:var(--muted)}
@media (max-width:480px){.legend span.x{display:none}}
@media (max-width:899px){.leaflet-bottom.leaflet-left{display:none}}
@media (min-width:900px){#prof{height:180px} .sheet{left:auto;right:0;width:min(720px,60vw);border-left:1px solid var(--rule);border-top-left-radius:12px} .hdr .bar{max-width:760px} :root{--hdr-h:96px}}
.leaflet-control-locate a{font-size:20px;text-align:center;display:block;cursor:pointer;text-decoration:none;color:#333}
.leaflet-control-locate.on a{color:#1E88E5;font-weight:700}
.leaflet-control-locate.follow a{background:#1E88E5;color:#fff}
.leaflet-container{font:inherit}
.leaflet-tooltip.rt{font-variant-numeric:tabular-nums;font-size:13px}
.gpsdot{background:#1E88E5;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(30,136,229,.35)}
.cursordot{background:#1F2328;border:2px solid #fff;border-radius:50%}
.pmw{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.pmw.end{box-shadow:0 0 0 3px #1D6E8C;background:rgba(29,110,140,.12)}
.pm{width:14px;height:14px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);box-sizing:border-box}
.pm.camp{background:#2E8B57;clip-path:polygon(50% 0,100% 100%,0 100%);border:0;box-shadow:none;width:16px;height:14px;filter:drop-shadow(0 0 1px #000)}
.pm.hut{background:#8B5A2B;border-radius:3px}
.pm.bed{background:#7A8290;border-radius:50%;width:10px;height:10px}
.pm.biv{background:#fff;border:2px solid #6B5A45;border-radius:2px;width:12px;height:12px}
.pm.pass{background:#1F2328;clip-path:polygon(50% 0,100% 100%,0 100%);border:0;box-shadow:none;width:18px;height:16px;filter:drop-shadow(0 0 1px #fff)}
.pm.push{background:#E0242A;border-radius:3px;transform:rotate(45deg);width:13px;height:13px}
.pm.note{background:#1D6E8C;border-radius:50%;width:12px;height:12px}
.wxm{background:rgba(250,250,247,.92);border:1px solid #B9BDB6;border-radius:999px;padding:1px 6px;font:600 11px "Barlow Condensed",system-ui,sans-serif;white-space:nowrap;color:#1F2328;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.wxm.hi{border-color:#1D6E8C;color:#1D6E8C}
.passlbl{background:transparent;border:0;font:600 12px "Barlow Condensed",system-ui,sans-serif;color:#1F2328;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff;white-space:nowrap;box-shadow:none}
.passlbl::before{display:none}
.stagelbl{background:rgba(250,250,247,.95);border:1px solid #B9BDB6;border-radius:6px;padding:1px 6px;font:600 12px "Barlow Condensed",system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);color:#1F2328}
.leaflet-popup-content{margin:10px 12px;font-size:14px;line-height:1.35;min-width:200px}
.leaflet-popup-content b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:18px;font-weight:600}
.leaflet-popup-content .ty{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.leaflet-popup-content .links a{display:inline-block;margin:6px 8px 0 0;padding:8px 12px;min-height:36px;line-height:20px;border-radius:6px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-close-button{width:30px!important;height:30px!important;font-size:22px!important;line-height:30px!important}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(122,130,144,.35)}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:rgba(122,130,144,.85);color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="map"></div>
<div class="hdr"><div class="bar">
  <div class="row1"><h1>Konstanz → Genova</h1><div class="sub" id="sub"></div></div>
  <div class="chips" id="chips"></div>
</div></div>
<div class="sheet" id="sheet">
  <div class="handle" id="handle"><i></i></div>
  <div class="nav off" id="nav">GPS aus — ◎ antippen für Standort</div>
  <div class="stat" id="stat"></div>
  <div class="strip" id="wx"></div>
  <div class="strip" id="fx"></div>
  <canvas id="prof"></canvas>
  <div class="legend"><span><i style="background:#2C3E63"></i>Asphalt</span><span><i style="background:#E08A00"></i>Schotter</span><span><i style="background:#E0242A"></i>Pfad/schieben</span><span class="x"><i class="pm camp" style="display:inline-block;vertical-align:middle;margin-right:3px;width:11px;height:10px"></i>Zeltplatz</span><span class="x"><i class="pm hut" style="display:inline-block;vertical-align:middle;margin-right:3px;width:10px;height:10px"></i>Hütte</span><span class="x"><i class="pm bed" style="display:inline-block;vertical-align:middle;margin-right:3px"></i>Bett</span><span class="x"><i class="pm biv" style="display:inline-block;vertical-align:middle;margin-right:3px;width:9px;height:9px"></i>Biwak</span><span class="attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OSM</a> · OpenTopoMap</span></div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="data/data.js"></script>
<script>
(function(){
const RT=window.RT, S=RT.stages, ND=S.length, css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MAPCOL={p:'#2C3E63',g:'#E08A00',t:'#E0242A'};          // theme-independent: the map tiles don't flip
const $=id=>document.getElementById(id);
// ---- flatten points ----
const P=[]; for(const s of RT.track){ for(const q of s.pts){ if(!P.length||q[3]>P[P.length-1][3]) P.push([q[0],q[1],q[2],q[3],s.c]); } }
const TOTAL=P[P.length-1][3]; const UP=S.reduce((x,s)=>x+s.up,0), DN=S.reduce((x,s)=>x+s.down,0);
$('sub').textContent=`${Math.round(TOTAL)} km · ↑ ${UP.toLocaleString('de')} m · ${ND} Tage`;
function idxAtKm(km){ let lo=0,hi=P.length-1; while(lo<hi){const m=(lo+hi)>>1; if(P[m][3]<km) lo=m+1; else hi=m;} return lo; }
function fmtKm(x){return x.toFixed(1).replace('.',',')+' km';}
function stageOf(km){ return S.find(s=>km<=s.end_km+1e-6)||S[ND-1]; }
function nearest(lat,lon){ const cl=Math.cos(lat*Math.PI/180); let best=1e18,bi=0;
  for(let i=0;i<P.length;i++){const dy=(P[i][0]-lat),dx=(P[i][1]-lon)*cl,d=dx*dx+dy*dy; if(d<best){best=d;bi=i;}}
  return {i:bi,km:P[bi][3],dist:Math.sqrt(best)*111.32}; }
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function popt(extra){ const hdr=document.querySelector('.hdr .bar').getBoundingClientRect(), sh=sheet.getBoundingClientRect(); return Object.assign({maxWidth:300,autoPanPaddingTopLeft:[10,hdr.bottom+10],autoPanPaddingBottomRight:[10,Math.max(0,innerHeight-sh.top)+10]},extra||{}); }
const wx=(lat,lon,name)=>`https://oduerr.github.io/weather/?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&name=${encodeURIComponent(name)}&model=bestmatch&panel=temperature&view=5d`;
// ---- map ----
const sheet=$('sheet');
const map=L.map('map',{preferCanvas:true,zoomControl:false,attributionControl:false,tap:true});
L.control.zoom({position:'topright'}).addTo(map);
L.control.attribution({position:'bottomleft',prefix:false}).addTo(map);
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap, SRTM · © OpenTopoMap (CC-BY-SA)'});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
const swiss=L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',{maxZoom:18,attribution:'© swisstopo'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri, Maxar'});
topo.addTo(map);
// ---- route (non-interactive; one map click -> nearest point) ----
const routeLayer=L.layerGroup().addTo(map);
for(const s of RT.track){ L.polyline(s.pts.map(q=>[q[0],q[1]]),{color:'#fff',weight:8,opacity:.8,interactive:false}).addTo(routeLayer); }
const routeLines=RT.track.map(s=>L.polyline(s.pts.map(q=>[q[0],q[1]]),{color:MAPCOL[s.c]||MAPCOL.p,weight:4,opacity:.95,interactive:false}).addTo(routeLayer));
map.on('zoomend',()=>{ const w=map.getZoom()>=12?5:4; routeLines.forEach(l=>l.setStyle({weight:w})); });
map.on('click',e=>{ const n=nearest(e.latlng.lat,e.latlng.lng); if(n.dist<=0.4*Math.pow(2,15-map.getZoom())+0.05) setCursor(n.km,true); });
// ---- places ----
const PL=RT.places||[]; const TY={camp_site:'Zeltplatz',caravan_site:'Stellplatz (Zelt ok)',alpine_hut:'Berghütte',wilderness_hut:'Biwak / Schutzhütte (unbewirtet)',hostel:'Hostel',hotel:'Hotel',guest_house:'Pension / B&B',chalet:'Chalet',apartment:'Ferienwohnung',motel:'Motel'};
function popup(pl){ const st=stageOf(pl.km); const off=pl.off>=1?pl.off.toFixed(1).replace('.',',')+' km':Math.round(pl.off*1000)+' m';
  const hgt=pl.off>0.3?`Route auf ${pl.ele} m`:`${pl.ele} m`;
  let h=`<div class="ty">${TY[pl.t]||esc(pl.t)}${pl.e?' · <b style="font-size:12px;color:#1D6E8C">am Etappenziel</b>':''}${pl.bc?' · Naturplatz':''}</div><b>${esc(pl.n||TY[pl.t]||'?')}</b><br>km ${pl.km.toFixed(1)} (Tag ${st.day}) · ${off} neben der Route · ${hgt}`;
  if(pl.o) h+=`<br><span class="ty">Öffnung</span> ${esc(pl.o)}`;
  h+='<div class="links">'; if(pl.w) h+=`<a href="${esc(pl.w.startsWith('http')?pl.w:'https://'+pl.w)}" target="_blank" rel="noopener">Website</a>`; if(pl.p) h+=`<a href="tel:${esc(pl.p.replace(/\s/g,''))}">${esc(pl.p)}</a>`;
  h+=`<a href="${wx(pl.lat,pl.lon,pl.n||TY[pl.t])}" target="_blank" rel="noopener">Wetter</a><a href="#" data-km="${pl.km}" class="tokm">Im Profil</a></div>`; return h; }
const icon=pl=>L.divIcon({className:'',html:`<div class="pmw${pl.e?' end':''}"><div class="pm ${pl.k}"></div></div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-12]});
const campLayer=L.layerGroup().addTo(map), hutLayer=L.layerGroup().addTo(map);
const bedLayer=L.markerClusterGroup({maxClusterRadius:36,disableClusteringAtZoom:13,showCoverageOnHover:false}).addTo(map);
const PM=PL.map(pl=>({pl,m:L.marker([pl.lat,pl.lon],{icon:icon(pl),title:pl.n,zIndexOffset:pl.e?300:0}).bindPopup(popup(pl),popt())}));
function buildPlaces(){ const [a,b]=range(); campLayer.clearLayers(); hutLayer.clearLayers(); bedLayer.clearLayers(); const beds=[];
  for(const {pl,m} of PM){ if(day&&(pl.km<a-2||pl.km>b+2)) continue; if(pl.k==='camp') campLayer.addLayer(m); else if(pl.k==='hut'||pl.k==='biv') hutLayer.addLayer(m); else beds.push(m); }
  bedLayer.addLayers(beds); }
// declutter: beds only from zoom 10, huts from zoom 9 (unless the user switched them off)
const want={bed:true,hut:true}; map.on('overlayadd',e=>{ if(e.layer===bedLayer) want.bed=true; if(e.layer===hutLayer) want.hut=true; }); map.on('overlayremove',e=>{ if(e.layer===bedLayer&&!auto) want.bed=false; if(e.layer===hutLayer&&!auto) want.hut=false; });
let auto=false; function declutter(){ const z=map.getZoom(); auto=true; const sb=want.bed&&z>=10, sh=want.hut&&z>=9;
  if(sb&&!map.hasLayer(bedLayer)) bedLayer.addTo(map); if(!sb&&map.hasLayer(bedLayer)) map.removeLayer(bedLayer); if(sh&&!map.hasLayer(hutLayer)) hutLayer.addTo(map); if(!sh&&map.hasLayer(hutLayer)) map.removeLayer(hutLayer); auto=false; }
map.on('zoomend',declutter);
// ---- features + weather ----
const FE=RT.features||[], WX=RT.weather||[]; const KIND={pass:'Pass',push:'Schiebepassage',note:'Hinweis'};
function fpopup(f){ const st=stageOf(f.km); let h=`<div class="ty">${KIND[f.k]} · km ${f.km.toFixed(1)} · Tag ${st.day}</div><b>${f.n}</b> <span style="color:var(--muted)">${f.ele} m</span><br>${f.txt}<div class="links">`;
  for(const l of f.links) h+=`<a href="${l.u}" target="_blank" rel="noopener">${l.l}</a>`;
  h+=`<a href="${wx(f.lat,f.lon,f.n)}" target="_blank" rel="noopener">Wetter</a><a href="#" data-km="${f.km}" class="tokm">Im Profil</a></div>`; return h; }
const featLayer=L.layerGroup().addTo(map), featMarkers={};
for(const f of FE){ const m=L.marker([f.lat,f.lon],{icon:L.divIcon({className:'',html:`<div class="pm ${f.k}"></div>`,iconSize:[18,16],iconAnchor:[9,8],popupAnchor:[0,-8]}),title:f.n,zIndexOffset:500}).bindPopup(fpopup(f),popt());
  if(f.k==='pass') m.bindTooltip(`${f.n} ${f.ele} m`,{permanent:true,direction:'right',offset:[8,0],className:'passlbl'});
  featLayer.addLayer(m); featMarkers[f.km]=m; }
const wxLayer=L.layerGroup(), wxHi=L.layerGroup(), wxAll=L.layerGroup(); let wxOn=true;
for(const w of WX){ const m=L.marker([w.lat,w.lon],{icon:L.divIcon({className:'',html:`<div class="wxm${w.h?' hi':''}">☁ ${w.n}</div>`,iconAnchor:[0,10]}),zIndexOffset:w.h?400:100});
  m.bindPopup(`<div class="ty">Wetter · km ${w.km} · ${w.ele} m</div><b>${w.n}</b><div class="links"><a href="${wx(w.lat,w.lon,w.n)}" target="_blank" rel="noopener">5-Tage-Wetter öffnen</a></div>`); (w.h?wxHi:wxAll).addLayer(m); }
function wxZoom(){ const z=map.getZoom(); if(!wxOn||z<8){ if(map.hasLayer(wxLayer)) map.removeLayer(wxLayer); return; } if(!map.hasLayer(wxLayer)) wxLayer.addTo(map);
  if(!wxLayer.hasLayer(wxHi)) wxLayer.addLayer(wxHi); if(z>=11&&!wxLayer.hasLayer(wxAll)) wxLayer.addLayer(wxAll); if(z<11&&wxLayer.hasLayer(wxAll)) wxLayer.removeLayer(wxAll); }
map.on('zoomend',wxZoom); map.on('overlayadd',e=>{ if(e.layer===wxLayer){wxOn=true; wxZoom();} }); map.on('overlayremove',e=>{ if(e.layer===wxLayer) wxOn=false; });
L.control.layers({'OpenTopoMap':topo,'swisstopo (nur CH)':swiss,'Satellit':sat,'OSM':osm},{'Zeltplätze':campLayer,'Hütten & Biwaks (ab Zoom 9)':hutLayer,'Betten ≤ 1,5 km (ab Zoom 10)':bedLayer,'Pässe & Hinweise':featLayer,'Wetterpunkte':wxLayer},{position:'topright',collapsed:true}).addTo(map);
// stage-end labels
for(const st of S){ L.marker([st.lat,st.lon],{icon:L.divIcon({className:'',html:`<div class="stagelbl">${st.day}·${st.to}</div>`,iconAnchor:[-7,24]}),zIndexOffset:600})
  .bindPopup(`<div class="ty">Etappenziel Tag ${st.day} · km ${st.end_km}</div><b>${st.to}</b> <span style="color:var(--muted)">${st.ele} m</span><br>${st.from} → ${st.to}: ${st.km} km · ↑ ${st.up} m · ↓ ${st.down} m<div class="links"><a href="#" class="today" data-day="${st.day}">Tag ${st.day} zeigen</a><a href="${wx(st.lat,st.lon,st.to)}" target="_blank" rel="noopener">Wetter</a></div>`).addTo(map); }
map.on('popupopen',e=>{ const el=e.popup.getElement(); const a=el.querySelector('.tokm'); if(a) a.onclick=ev=>{ev.preventDefault(); const km=+a.dataset.km; const [ra,rb]=range(); if(km<ra||km>rb) selectDay(stageOf(km).day,true); setCursor(km,true); sheet.classList.remove('min'); drawProfile();};
  const b=el.querySelector('.today'); if(b) b.onclick=ev=>{ev.preventDefault(); selectDay(+b.dataset.day); map.closePopup();}; });
// ---- strips ----
function strips(){ const [a,b]=range();
  const wl=WX.filter(w=>day?(w.km>=a-0.1&&w.km<=b+0.1):(w.h||w.km===0||w.km>=TOTAL-1));
  $('wx').innerHTML='<span class="lbl">Wetter</span>'+wl.map(w=>`<a class="${w.h?'hi':''}" href="${wx(w.lat,w.lon,w.n)}" target="_blank" rel="noopener">${w.h?'▲ ':''}${w.n}</a>`).join('');
  const fl=FE.filter(f=>f.km>=a-0.1&&f.km<=b+0.1); const fx=$('fx'); fx.style.display=(fl.length||day)?'':'none';
  let hint=''; if(day){ const cs=PL.filter(pl=>pl.k==='camp'&&pl.km>=a-2&&pl.km<=b+2); if(!cs.length){ const nx=PL.find(pl=>pl.k==='camp'&&pl.km>b); hint=`<button data-km="${nx?nx.km:b}" class="hi" style="background:#2E8B57;color:#fff">⛺ kein Zeltplatz auf dieser Etappe${nx?' · nächster bei km '+nx.km.toFixed(0)+' ('+esc(nx.n||'Camping')+')':''}</button>`; } }
  fx.innerHTML='<span class="lbl">Punkte</span>'+hint+fl.map(f=>`<button data-km="${f.km}">${f.k==='push'?'⚠ ':f.k==='pass'?'▲ ':'ⓘ '}${esc(f.n)}</button>`).join('');
  fx.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ const km=+bt.dataset.km; const m=featMarkers[km]; if(m){ map.setView(m.getLatLng(),Math.max(map.getZoom(),13)); m.openPopup(); } else { const p=P[idxAtKm(km)]; map.setView([p[0],p[1]],12); } setCursor(km,false); }); }
// ---- cursor ----
const cursor=L.marker([P[0][0],P[0][1]],{icon:L.divIcon({className:'cursordot',iconSize:[12,12]}),interactive:false}).addTo(map);
cursor.bindTooltip('',{direction:'top',className:'rt',offset:[0,-6]});
let curKm=0;
function setCursor(km,openTip){ curKm=km; const i=idxAtKm(km), p=P[i]; cursor.setLatLng([p[0],p[1]]); const st=stageOf(km);
  cursor.setTooltipContent(`km ${km.toFixed(1)} · ${p[2]} m<br>Tag ${st.day}: noch ${fmtKm(st.end_km-km)} bis ${st.to}`); if(openTip) cursor.openTooltip(); drawProfile(); }
// ---- day selection ----
let day=0; const chips=$('chips');
function chip(label,d){const b=document.createElement('button');b.className='chip';b.textContent=label;b.onclick=()=>selectDay(d);chips.appendChild(b);return b;}
chip('Alle',0); for(const st of S) chip(String(st.day),st.day);
function range(){ if(!day) return [0,TOTAL]; const st=S[day-1]; return [st.start_km,st.end_km]; }
function fitPad(){ const sh=sheet.getBoundingClientRect(), W=innerWidth, H=innerHeight, hdr=document.querySelector('.hdr .bar').getBoundingClientRect();
  const bottom=Math.max(0,H-sh.top); return W>=900?{paddingTopLeft:[24,hdr.bottom+16],paddingBottomRight:[sh.width+24,16]}:{paddingTopLeft:[16,hdr.bottom+12],paddingBottomRight:[16,bottom+12]}; }
function selectDay(d,noFit){ day=Math.max(0,Math.min(ND,d|0)); [...chips.children].forEach((c,i)=>{c.classList.toggle('on',i===day); if(i===day) c.scrollIntoView({inline:'center',block:'nearest'});});
  const [a,b]=range(); if(!noFit){ const pts=P.slice(idxAtKm(a),idxAtKm(b)+1).map(p=>[p[0],p[1]]); map.fitBounds(L.latLngBounds(pts),fitPad()); }
  const stat=$('stat');
  if(!day) stat.innerHTML=`<b>Gesamt</b><span>${Math.round(TOTAL)} km</span><span>↑ ${UP.toLocaleString('de')} m</span><span>↓ ${DN.toLocaleString('de')} m</span><span>${ND} Tage</span><span class="ci" id="ci"></span>`;
  else { const st=S[day-1]; stat.innerHTML=`<b>Tag ${st.day}</b><span>${st.from} → <strong>${st.to}</strong></span><span>${st.km} km</span><span>↑ ${st.up.toLocaleString('de')} m</span><span>↓ ${st.down.toLocaleString('de')} m</span><span class="ci" id="ci"></span>`; }
  history.replaceState(null,'',day?('#d'+day):location.pathname); if(curKm<a||curKm>b) curKm=a; buildPlaces(); strips(); drawProfile(); updateNav(); }
window.addEventListener('hashchange',()=>{ const h=location.hash.match(/^#d(\d+)/); if(!h) return; const d=+h[1]; if(d!==day) selectDay(d); });
// ---- profile ----
const cv=$('prof'), ctx=cv.getContext('2d');
function drawProfile(){ const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr;} ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const [a,b]=range(), L0=34,R0=8,T0=14,B0=18, i0=idxAtKm(a), i1=idxAtKm(b), overview=!day;
  let emin=1e9,emax=-1e9; for(let i=i0;i<=i1;i++){emin=Math.min(emin,P[i][2]);emax=Math.max(emax,P[i][2]);}
  const span=emax-emin, step=span>1500?500:span>600?250:100; emin=Math.floor(Math.max(0,emin-40)/step)*step; emax=Math.ceil((emax+60)/step)*step;
  const X=km=>L0+(km-a)/(b-a)*(W-L0-R0), Y=e=>T0+(1-(e-emin)/(emax-emin))*(H-T0-B0);
  const C_GRID=css('--grid'), C_MUTED=css('--muted'), C_INK=css('--ink'), C_ACC=css('--accent'), C_AREA=css('--area');
  ctx.strokeStyle=C_GRID; ctx.lineWidth=1; ctx.fillStyle=C_MUTED; ctx.font='11px system-ui'; ctx.textAlign='right';
  for(let e=emin;e<=emax;e+=step){ ctx.beginPath();ctx.moveTo(L0,Y(e));ctx.lineTo(W-R0,Y(e));ctx.stroke(); ctx.fillText(e,L0-4,Y(e)+4); }
  ctx.beginPath(); ctx.moveTo(X(a),Y(emin)); for(let i=i0;i<=i1;i++) ctx.lineTo(X(P[i][3]),Y(P[i][2])); ctx.lineTo(X(b),Y(emin)); ctx.closePath(); ctx.fillStyle=C_AREA; ctx.fill();
  ctx.lineWidth=2.4; let cur=null; for(let i=i0;i<=i1;i++){ const c=P[i][4]; if(c!==cur){ if(cur!==null) ctx.stroke(); ctx.beginPath(); ctx.strokeStyle=MAPCOL[c]||MAPCOL.p; if(i>i0) ctx.moveTo(X(P[i-1][3]),Y(P[i-1][2])); cur=c;} ctx.lineTo(X(P[i][3]),Y(P[i][2])); } ctx.stroke();
  ctx.fillStyle=C_MUTED; ctx.textAlign='center'; ctx.font='11px system-ui'; const kstep=(b-a)>300?100:(b-a)>120?20:10;
  for(let k=Math.ceil(a/kstep)*kstep;k<=b;k+=kstep){ ctx.fillText(k+(k===Math.ceil(a/kstep)*kstep?' km':''),X(k),H-4); }
  ctx.font='600 11px "Barlow Condensed",system-ui';
  for(const st of S){ if(st.end_km>a&&st.end_km<=b+1e-6){ const x=X(st.end_km); ctx.strokeStyle=C_ACC; ctx.setLineDash([3,3]); ctx.beginPath();ctx.moveTo(x,T0-4);ctx.lineTo(x,H-B0);ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=C_ACC; if(overview){ ctx.textAlign='right'; ctx.fillText(st.day, x-3, T0+6); } else { ctx.textAlign=(x>W-70)?'right':'left'; ctx.fillText(`${st.to} ${st.ele} m`, x+(x>W-70?-3:3), T0+6); } } }
  const endSpans=S.filter(st=>st.end_km>a&&st.end_km<=b+1e-6).map(st=>{ const ex=X(st.end_km); const ew=overview?12:ctx.measureText(`${st.to} ${st.ele} m`).width+6; return ex>W-70?[ex-ew,ex]:[ex,ex+ew]; });
  if(!overview||W>700){ for(const f of FE){ if(f.k!=='pass'||f.km<a||f.km>b) continue; const x=X(f.km), y=Y(f.ele); ctx.fillStyle=C_INK; ctx.beginPath(); ctx.moveTo(x,y-9); ctx.lineTo(x+4,y-2); ctx.lineTo(x-4,y-2); ctx.closePath(); ctx.fill();
    if(!overview||f.ele>1300){ const lbl=`${f.n.replace('Passo ','P. ').replace('Capanne di ','')} ${f.ele}`; const tw=ctx.measureText(lbl).width; const right=x+6+tw>W-R0; const span=right?[x-6-tw,x-6]:[x+6,x+6+tw];
      const clash=y-12<T0+14&&endSpans.some(es=>span[0]<es[1]&&span[1]>es[0]); ctx.textAlign=right?'right':'left'; ctx.fillText(lbl, x+(right?-6:6), clash?y+18:y-12); } } }
  for(const pl of PL){ if(pl.k==='bed'||pl.km<a||pl.km>b||(overview&&pl.k!=='camp')) continue; const x=X(pl.km); ctx.fillStyle=pl.k==='camp'?'#2E8B57':'#8B5A2B'; ctx.beginPath(); if(pl.k==='camp'){ctx.moveTo(x,H-B0-9);ctx.lineTo(x+4,H-B0-1);ctx.lineTo(x-4,H-B0-1);ctx.closePath();} else ctx.rect(x-3,H-B0-8,6,6); ctx.fill(); }
  if(gps&&gps.km>=a&&gps.km<=b){ const x=X(gps.km); ctx.fillStyle='#1E88E5'; ctx.beginPath(); ctx.arc(x,Y(P[idxAtKm(gps.km)][2]),5,0,7); ctx.fill(); }
  if(curKm>=a&&curKm<=b){ const x=X(curKm), e=P[idxAtKm(curKm)][2]; ctx.strokeStyle=C_INK; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(x,T0);ctx.lineTo(x,H-B0);ctx.stroke(); ctx.fillStyle=C_INK; ctx.beginPath(); ctx.arc(x,Y(e),4,0,7); ctx.fill();
    const ci=$('ci'); if(ci){ const st2=stageOf(curKm); ci.textContent=`▸ km ${curKm.toFixed(1)} · ${e} m · noch ${fmtKm(st2.end_km-curKm)} bis ${st2.to}`; } }
  cv._X={a,b,L0,R0,W}; }
function kmFromEvent(ev){ const r=cv.getBoundingClientRect(), x=ev.clientX-r.left; const {a,b,L0,R0,W}=cv._X; return Math.min(b,Math.max(a,a+(x-L0)/(W-L0-R0)*(b-a))); }
let dragging=false;
cv.addEventListener('pointerdown',e=>{dragging=true;cv.setPointerCapture(e.pointerId);setCursor(kmFromEvent(e),true);});
cv.addEventListener('pointermove',e=>{ if(dragging||e.pointerType==='mouse') setCursor(kmFromEvent(e),true); });
cv.addEventListener('pointerup',()=>{dragging=false;}); cv.addEventListener('pointercancel',()=>{dragging=false;});
cv.addEventListener('dblclick',()=>{ const p=P[idxAtKm(curKm)]; map.setView([p[0],p[1]],Math.max(map.getZoom(),14)); });
$('handle').onclick=()=>{ sheet.classList.toggle('min'); setTimeout(()=>{drawProfile(); if(day) selectDay(day);},280); };
// ---- GPS ----
let gps=null, gpsM=null, gpsC=null, watchId=null, follow=false, ctl=null;
const Locate=L.Control.extend({onAdd(){ const d=L.DomUtil.create('div','leaflet-bar leaflet-control leaflet-control-locate'); const a=L.DomUtil.create('a','',d); a.href='#'; a.title='Standort (l)'; a.innerHTML='◎';
  L.DomEvent.on(a,'click',e=>{L.DomEvent.stop(e); locateTap();}); ctl=d; return d; }});
new Locate({position:'topright'}).addTo(map);
function locateTap(){ if(watchId===null) startGps(); else if(!follow){ follow=true; ctl.classList.add('follow'); if(gps) map.setView([gps.lat,gps.lon],Math.max(map.getZoom(),14)); } else stopGps(); }
function startGps(){ if(!navigator.geolocation){ setNav('Kein GPS im Browser — auf dem Handy braucht die Seite https.',true); return; }
  ctl.classList.add('on','follow'); follow=true; setNav('Suche Standort …',true);
  watchId=navigator.geolocation.watchPosition(pos=>{ const {latitude:la,longitude:lo,accuracy:acc}=pos.coords; const n=nearest(la,lo); gps={lat:la,lon:lo,acc,km:n.km,off:n.dist};
    if(!gpsM){ gpsC=L.circle([la,lo],{radius:acc,color:'#1E88E5',weight:1,fillOpacity:.12,interactive:false}).addTo(map); gpsM=L.marker([la,lo],{icon:L.divIcon({className:'gpsdot',iconSize:[14,14]}),interactive:false,zIndexOffset:1000}).addTo(map); }
    else { gpsC.setLatLng([la,lo]).setRadius(acc); gpsM.setLatLng([la,lo]); }
    if(follow){ const pt=map.latLngToContainerPoint([la,lo]), sz=map.getSize(); if(pt.x<sz.x*.2||pt.x>sz.x*.8||pt.y<sz.y*.25||pt.y>sz.y*.7) map.panTo([la,lo]); }
    updateNav(); drawProfile(); },
   err=>{ if(err.code===3) return; stopGps(); setNav(err.code===1?'Standort verweigert — in den Browser-Einstellungen erlauben.':'Standort nicht verfügbar: '+err.message,true); },
   {enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
function stopGps(){ if(watchId!==null) navigator.geolocation.clearWatch(watchId); watchId=null; follow=false; ctl.classList.remove('on','follow'); if(gpsM){map.removeLayer(gpsM);map.removeLayer(gpsC);gpsM=gpsC=null;} gps=null; updateNav(); drawProfile(); }
map.on('dragstart zoomstart',()=>{ if(follow){ follow=false; ctl.classList.remove('follow'); } });
function setNav(t,off){ const n=$('nav'); n.textContent=t; n.classList.toggle('off',!!off); }
function updateNav(){ if(!gps){ if(watchId===null) setNav('GPS aus — ◎ antippen für Standort',true); return; }
  const st=stageOf(gps.km); const off=gps.off>=1?gps.off.toFixed(1).replace('.',',')+' km':Math.round(gps.off*1000)+' m';
  let nc=null,nb=null; for(const pl of PL){ if(pl.km<gps.km-0.5) continue; if(pl.k==='camp'&&pl.off<=2&&(!nc||pl.km<nc.km)) nc=pl; if(pl.k!=='camp'&&pl.off<=1.0&&(!nb||pl.km<nb.km)) nb=pl; }
  setNav(`📍 km ${gps.km.toFixed(1)} · ${off} neben Route · noch ${fmtKm(st.end_km-gps.km)} bis ${st.to}`+(nc?` · ⛺ ${fmtKm(nc.km-gps.km)}`:'')+(nb?` · ${nb.k==='bed'?'🛏':'🏠'} ${fmtKm(nb.km-gps.km)}`:''),false); }
// ---- init ----
let saved=null; try{ saved=JSON.parse(localStorage.getItem('rt.view')||'null'); }catch(e){}
// hash: #d4  |  #d4/46.54,8.76/13  |  #46.54,8.76/13   (day, optional centre/zoom)
const h=location.hash.match(/^#(?:d(\d+))?\/?(?:(-?[\d.]+),(-?[\d.]+)\/(\d+))?/);
const hd=h&&h[1]?+h[1]:null, hc=h&&h[2]?[+h[2],+h[3]]:null, hz=h&&h[4]?+h[4]:null;
selectDay(hd!==null?hd:(hc?day:(saved&&saved.day)||0), !!hc||(hd===null&&saved&&saved.c));
if(hc){ map.setView(hc,hz||13); } else if(hd===null&&saved&&saved.c){ try{ map.setView(saved.c,saved.z); }catch(e){} }
let saveT=null; map.on('moveend',()=>{ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('rt.view',JSON.stringify({day,c:map.getCenter(),z:map.getZoom()})); }catch(e){} },400); });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight') selectDay(day+1); else if(e.key==='ArrowLeft') selectDay(day-1); else if(e.key==='l'||e.key==='L') locateTap(); });
wxZoom(); declutter(); if(innerHeight<600) sheet.classList.add('min'); window.addEventListener('resize',drawProfile); if(document.fonts) document.fonts.ready.then(drawProfile); setTimeout(drawProfile,60);
})();
</script>
