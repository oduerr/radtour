<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radtouren</title>
<meta name="theme-color" content="#1D6E8C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<script>
// old links: /radtour/#d4 or /radtour/#46.5,8.7/13 belonged to the Konstanz → Genova map
if(/^#(d\d+|-?[\d.]+,-?[\d.]+\/\d+)/.test(location.hash)) location.replace((location.protocol==='file:'?'genova/index.html':'genova/')+location.hash);
</script>
<style>
:root{--bg:#F2F3EF;--panel:#FAFAF7;--ink:#1F2328;--muted:#646A72;--rule:#D4D7D0;--accent:#1D6E8C;--chip:#E6E8E2}
@media (prefers-color-scheme: dark){:root{--bg:#15181C;--panel:#1C2025;--ink:#E8E6E0;--muted:#9AA0A6;--rule:#2E333A;--accent:#5FB3D1;--chip:#2A2F36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding:calc(12px + env(safe-area-inset-top,0)) 16px calc(24px + env(safe-area-inset-bottom,0))}
h1{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:26px;font-weight:700;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.tour{display:block;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0 0 10px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tour b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:22px;font-weight:700;display:block}
.tour span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tour .go{float:right;background:var(--accent);color:#fff;border-radius:999px;padding:3px 12px;font:600 14px "Barlow Condensed",system-ui,sans-serif;margin-top:2px}
.more{margin-top:18px;font-size:13px;color:var(--muted)} .more a{color:var(--accent)}
.files{display:block;margin:-6px 0 14px 14px;font-size:13px;color:var(--accent)}
</style>
</head>
<body>
<h1>Radtouren</h1>
<p class="sub">Geplante Touren mit Karte, Profil und Unterkünften. Antippen öffnet die Tourkarte.</p>
<div id="list"></div>
<p class="more"><a href="rueckweg.html">Rückweg-Optionen</a> · <a href="rueckweg-bozen.html">Rückweg ab Bozen</a></p>
<script src="tours/index.js"></script>
<script>
const L=document.getElementById('list');
for(const t of (window.TOURS||[])){ const a=document.createElement('a'); a.className='tour'; a.href=t.slug+'/';
  a.innerHTML=`<span class="go">Karte</span><b>${t.name}</b><span>${t.dates?t.dates+' · ':''}${t.days} Tage · ${t.km.toLocaleString('de')} km · ↑ ${t.up.toLocaleString('de')} m</span>`; L.appendChild(a);
  const f=document.createElement('a'); f.className='files'; f.href='tours/'+t.slug+'/files/'; f.textContent='GPX-Dateien'; L.appendChild(f); }
if(!L.children.length) L.textContent='Noch keine Tour gebaut (python3 tools/build_pages.py).';
</script>
</body>
</html>
